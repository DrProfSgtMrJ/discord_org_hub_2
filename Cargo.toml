[workspace]
members = [
    "backend", "hub_bot", "service", "migration", "entity"
]
resolver = "2"

[workspace.dependencies]
entity = { path = "entity" }
migration = { path = "migration" }
uuid = { version = "1.0", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = {version = "1.40", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15.0"
sea-orm = { version = "1.1.19", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "uuid", "chrono"] }
